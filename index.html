<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP Tracker - Ragnarok Online</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Landing Screen */
    #landing-page {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      text-align: center; padding: 20px;
    }
    #landing-page h1 { font-size: 2.5rem; color: #38bdf8; letter-spacing: 2px; margin-bottom: 8px; }
    #landing-page p { color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
    .btn-enter {
      background-color: #0284c7; color: white; border: none; padding: 12px 32px;
      font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer;
      text-transform: uppercase; letter-spacing: 1px; transition: background 0.2s;
    }
    .btn-enter:hover { background-color: #0369a1; }

    /* Dashboard */
    #dashboard { display: none; width: 100%; height: 100vh; flex-direction: column; }
    header {
      background: #1e293b; padding: 12px 20px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
    }
    header h2 { color: #38bdf8; font-size: 1.2rem; }
    .btn-toggle {
      background: #0284c7; color: white; border: none; padding: 8px 16px;
      border-radius: 4px; font-weight: bold; cursor: pointer;
    }

    /* Embedded Hercules Frame */
    .iframe-container { flex: 1; width: 100%; height: calc(100vh - 60px); }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- Landing Page -->
  <div id="landing-page">
    <h1>MVP TRACKER</h1>
    <p>RAGNAROK ONLINE</p>
    <button class="btn-enter" onclick="enterTracker()">ENTER TRACKER</button>
  </div>

  <!-- Dashboard with Embedded Hercules Tracker -->
  <div id="dashboard">
    <header>
      <h2>LIVE MVP TRACKER</h2>
      <button class="btn-toggle" onclick="reloadTracker()">Refresh Live Data</button>
    </header>
    <div class="iframe-container">
      <iframe id="hercules-frame" src="https://yggdrasil-septiembre.onhercules.app/tracker"></iframe>
    </div>
  </div>

  <script>
    function enterTracker() {
      document.getElementById('landing-page').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
    }

    function reloadTracker() {
      const frame = document.getElementById('hercules-frame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
